name: e-horta

services:
  postgres:
    image: postgres:16-alpine
    container_name: e-horta-postgres
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: ehorta
      POSTGRES_PASSWORD: ehorta_dev_2024
      POSTGRES_DB: e_horta
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ehorta -d e_horta']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: e-horta-redis
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: e-horta-minio
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      MINIO_ROOT_USER: ehorta_minio
      MINIO_ROOT_PASSWORD: ehorta_minio_dev_2024
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: e-horta-api
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://ehorta:ehorta_dev_2024@postgres:5432/e_horta
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-change-me-32ch}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-insecure-jwt-refresh-secret-32c}
      CORS_ORIGIN: http://localhost:3000
      SHIPPING_STANDARD_FEE: 9.90
      SHIPPING_EXPRESS_FEE: 14.90
      SHIPPING_STANDARD_DAYS: 2
      SHIPPING_EXPRESS_DAYS: 0
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev-webhook-secret-change-me}
      ENABLE_SANDBOX_SIMULATE: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    container_name: e-horta-web
    environment:
      # Força o bind do Next standalone (o Docker sobrescreve a ENV HOSTNAME do Dockerfile)
      HOSTNAME: 0.0.0.0
      API_SERVER_URL: http://api:8080/api/v1
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
        NEXT_PUBLIC_SITE_URL: http://localhost:3001
    container_name: e-horta-admin
    environment:
      HOSTNAME: 0.0.0.0
      API_SERVER_URL: http://api:8080/api/v1
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data: